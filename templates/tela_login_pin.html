<!-- Script de Lógica do Teclado e Roteamento -->
    <script type="module">
        import { processarLogin } from '/static/js/operacionalController.js';

        // Torna as variáveis e funções acessíveis na página
        window.currentPin = "";
        window.maxDigits = 4;

        window.updateDisplay = function() {
            const dots = document.querySelectorAll('.pin-dot');
            dots.forEach((dot, index) => {
                if (index < window.currentPin.length) {
                    dot.classList.add('bg-slate-800', 'border-slate-800');
                    dot.classList.remove('border-slate-300');
                } else {
                    dot.classList.remove('bg-slate-800', 'border-slate-800');
                    dot.classList.add('border-slate-300');
                }
            });
            document.getElementById('mensagemErro').classList.add('opacity-0');
        }

        window.addNumber = function(num) {
            if (window.currentPin.length < window.maxDigits) {
                window.currentPin += num.toString();
                window.updateDisplay();
                if (window.currentPin.length === window.maxDigits) {
                    setTimeout(window.submitPin, 200); 
                }
            }
        }

        window.clearPin = function() {
            window.currentPin = window.currentPin.slice(0, -1);
            window.updateDisplay();
        }

        window.mostrarErro = function(mensagem) {
            window.currentPin = "";
            window.updateDisplay();
            const msgErro = document.getElementById('mensagemErro');
            msgErro.innerText = mensagem; // Mostra a mensagem que veio do banco
            msgErro.classList.remove('opacity-0');
            
            const box = document.querySelector('.max-w-sm');
            box.classList.add('animate-pulse');
            setTimeout(() => box.classList.remove('animate-pulse'), 500);
        }

        // AQUI ESTÁ O SEGUNDO CÓDIGO APLICADO
        window.submitPin = async function() {
            if (window.currentPin.length === 0) return;

            // Chama o nosso motor do Supabase
            const resultado = await processarLogin(window.currentPin);
            
            if (resultado.sucesso) {
                window.location.href = resultado.rota;
            } else {
                window.mostrarErro(resultado.mensagem);
            }
        }
    </script>
</body>
</html>
